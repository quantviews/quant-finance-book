project:
  type: book
  output-dir: _book

book:
  title: "Количественные финансы"
  subtitle: "Анализ финансовых данных на R и Python"
  author: "Марсель Салихов"
  date: 2025-08-30
  date-format: "YYYY"
  chapters:
    - index.qmd
    - 01-intro.qmd
    - part: "Финансовые данные и их обработка"
      chapters:
        - 02-financial-data.qmd
        - 02-financial-data-russia.qmd
        - 04-returns-risk.qmd
    # Добавляйте главы по мере написания:
    # - 03-var-es.qmd
    # - 04-capm.qmd
    # - 05-bond-pricing.qmd
    - references.qmd

lang: ru
bibliography: references.bib
# Одинаковое оформление списка литературы в HTML и PDF (через Pandoc citeproc).
citeproc: true

toc: true
toc-depth: 3
number-sections: true
number-depth: 3

execute:
  freeze: auto   # код главы перевыполняется, только если изменился её исходник
  echo: true
  warning: false

format:
  html:
    theme:
      - lumen
      - brand
      - styles/html.scss
    # MathJax 4 (со шрифтом STIX Two) подключается в styles/mathjax.html.
    html-math-method: plain
    include-in-header: styles/mathjax.html
    fig-format: svg
    code-copy: true
    code-overflow: wrap
    code-link: true
    code-fold: show
    smooth-scroll: true
    reader-mode: true

  typst:
    # Шаблон учебника: orange-book (встроен в Quarto) + собственные настройки.
    filters:
      - path: styles/tabset-print.lua   # в PDF только Python-вкладка
        at: pre-ast
    template-partials:
      - styles/typst/typst-show.typ
    font-paths:
      - fonts
    fig-format: svg
    code-overflow: wrap
    keep-typ: true
