project:
  type: book
  output-dir: _book

book:
  title: "Количественные финансы"
  subtitle: "Анализ финансовых данных на Python и R"
  author: "Марсель Салихов"
  date: 2026-09-30
  date-format: "YYYY"
  # Имя PDF-файла (латиницей, чтобы ссылка была читаемой).
  output-file: "quant-finance-book"
  repo-url: https://github.com/quantviews/quant-finance-book
  sidebar:
    tools:
      - icon: file-earmark-pdf
        href: quant-finance-book.pdf
        text: "Скачать PDF"
  chapters:
    - index.qmd
    - 01-intro.qmd
    - part: "Данные и инструменты"
      chapters:
        - 02-data-sources.qmd
        - 03-data-preparation.qmd
        - 04-returns-risk.qmd
    - part: "Корпоративная отчётность"
      chapters:
        - 05-accounting-data.qmd
        - 06-industry-analysis.qmd
    - part: "Временные ряды"
      chapters:
        - 07-arma.qmd
        - 08-volatility.qmd
        - 09-ml-forecasting.qmd
    - part: "Риск и портфели"
      chapters:
        - 10-var-es.qmd
        - 11-portfolio.qmd
        - 12-capm-factors.qmd
    - part: "Долговой рынок"
      chapters:
        - 13-bonds.qmd
        - 14-credit-risk.qmd
    - part: "Торговые стратегии"
      chapters:
        - 15-backtesting.qmd
        - 16-momentum.qmd
        - 17-microstructure.qmd
    - references.qmd
  appendices:
    - appendix-python.qmd
    - appendix-data.qmd
    - appendix-projects.qmd

lang: ru
language:
  # Подписи перекрёстных ссылок в середине фразы – со строчной буквы.
  crossref-sec-prefix: "раздел"
  crossref-eq-prefix: "формула"

# Графики: широкие и невысокие (по умолчанию knitr делает 7 × 5 дюймов).
fig-width: 6.5
fig-height: 3.2
bibliography: references.bib
# Одинаковое оформление списка литературы в HTML и PDF (через Pandoc citeproc).
citeproc: true

toc: true
toc-depth: 3
number-sections: true
number-depth: 3

execute:
  freeze: auto   # код главы перевыполняется, только если изменился её исходник
  echo: true
  warning: false

format:
  html:
    theme:
      - lumen
      - brand
      - styles/html.scss
    # MathJax 4 со шрифтом STIX Two: адрес здесь, настройки – в styles/mathjax.html.
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"
    include-in-header: styles/mathjax.html
    fig-format: svg
    code-copy: true
    code-overflow: wrap
    code-link: true
    code-fold: show
    code-summary: "Код"
    # Врезки как в PDF: полоса слева, без рамки и цветной шапки.
    callout-appearance: simple
    smooth-scroll: true
    reader-mode: true
    # Поля в стиле Tufte: сноски и ссылки на литературу – на правом поле,
    # короткие заметки – в блоках ::: {.column-margin}.
    reference-location: margin
    citation-location: margin

  typst:
    # Шаблон учебника: orange-book (встроен в Quarto) + собственные настройки.
    filters:
      - path: styles/tabset-print.lua   # в PDF только Python-вкладка
        at: pre-ast
    template-partials:
      - styles/typst/typst-show.typ
    font-paths:
      - fonts
    fig-format: svg
    code-overflow: wrap
    keep-typ: true
